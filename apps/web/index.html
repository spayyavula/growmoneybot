<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GrowMoneyBot — Build and backtest trading strategies</title>
    <meta name="description" content="Build trading strategies from technical indicators, backtest them on crypto and US stocks, and send them to TradingView as Pine Script." />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:title" content="GrowMoneyBot" />
    <meta property="og:description" content="Build and backtest trading strategies, then take them to TradingView." />
    <meta property="og:url" content="https://growmoneybot.com" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Apply the saved (or system) day/night theme before first paint to avoid a flash
      (function () {
        var t = null;
        try { t = localStorage.getItem("gmb-theme"); } catch (e) {}
        if (t !== "dark" && t !== "light") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
        document.querySelector('meta[name="theme-color"]').setAttribute("content", t === "dark" ? "#000000" : "#f5f5f7");
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
